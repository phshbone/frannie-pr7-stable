name: Frannie Live Smoke Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Browser target to verify
        required: true
        default: deployed
        type: choice
        options:
          - local
          - deployed
      live_base_url:
        description: Optional deployed HTTPS URL override
        required: false
        type: string
  pull_request:
    branches:
      - main

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      LIVE_SMOKE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'local' }}
      DEFAULT_LIVE_BASE_URL: https://phshbone.github.io/frannie-pr7-stable/
      INPUT_LIVE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.live_base_url || '' }}
      LOCAL_BASE_URL: http://127.0.0.1:4173
      DEPLOY_IDENTITY_FILES: index.html,app.js,shared-care.js,shared-care-core.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run existing regression tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve test mode and URL
        shell: bash
        run: |
          set -euo pipefail
          mode="${LIVE_SMOKE_MODE:-local}"
          case "$mode" in
            local)
              base="$LOCAL_BASE_URL"
              ;;
            deployed)
              base="${INPUT_LIVE_BASE_URL:-}"
              if [ -z "$base" ]; then base="$DEFAULT_LIVE_BASE_URL"; fi
              case "$base" in
                https://*) ;;
                *) echo "Deployed Mode requires an HTTPS URL: $base"; exit 2 ;;
              esac
              ;;
            *)
              echo "Unknown LIVE_SMOKE_MODE: $mode"
              exit 2
              ;;
          esac
          echo "BASE_URL=$base" >> "$GITHUB_ENV"
          echo "Live Smoke Test mode: $mode"
          echo "URL under test: $base"
          echo "Commit SHA: ${GITHUB_SHA:-unknown}"

      - name: Start local smoke server
        if: env.LIVE_SMOKE_MODE == 'local'
        shell: bash
        run: |
          set -euo pipefail
          npm run serve:smoke > /tmp/frannie-live-smoke-server.log 2>&1 &
          echo $! > /tmp/frannie-live-smoke-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BASE_URL" > /dev/null; then
              echo "Local smoke server ready at $BASE_URL"
              exit 0
            fi
            sleep 1
          done
          echo "Local smoke server did not become ready."
          cat /tmp/frannie-live-smoke-server.log || true
          exit 1

      - name: Wait for exact deployed build
        if: env.LIVE_SMOKE_MODE == 'deployed'
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          IFS=',' read -ra files <<< "$DEPLOY_IDENTITY_FILES"
          deadline=$((SECONDS + 300))
          while true; do
            all_match=1
            for raw in "${files[@]}"; do
              file="$(echo "$raw" | xargs)"
              [ -n "$file" ] || continue
              [ -f "$file" ] || { echo "Identity file missing from checkout: $file"; exit 1; }
              tmp="$(mktemp)"
              rev="${GITHUB_SHA:-manual}-${RANDOM}"
              if ! curl --fail --silent --show-error \
                  -H 'Cache-Control: no-cache, no-store, max-age=0' \
                  -H 'Pragma: no-cache' \
                  "${base}/${file}?live-smoke-rev=${rev}" -o "$tmp"; then
                all_match=0
              elif ! cmp -s "$file" "$tmp"; then
                all_match=0
              fi
              rm -f "$tmp"
            done
            if [ "$all_match" -eq 1 ]; then
              echo "Exact deployed build identity verified for ${GITHUB_SHA:-unknown}."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for deployed files to match checkout."
              exit 1
            fi
            sleep 10
          done

      - name: Run Live Smoke Test
        run: npm run test:live-smoke

      - name: Upload successful verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frannie-live-smoke-verification-${{ env.LIVE_SMOKE_MODE }}
          path: verification-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frannie-playwright-report-${{ env.LIVE_SMOKE_MODE }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frannie-playwright-failure-evidence-${{ env.LIVE_SMOKE_MODE }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
